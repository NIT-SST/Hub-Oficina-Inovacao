<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#073B6F" />
  <meta name="description" content="Guia de consulta para uma oficina de inovação, com orientações e exemplos da identificação do problema ao pitch." />
  <title>Oficina de Inovação | SESI Vida</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#EFF8FF', 100:'#D9EEFF', 500:'#0875C9', 600:'#005FAF', 700:'#084D88', 800:'#073B6F', 900:'#062B52' },
            action: '#F58220', success: '#4DAA32', purple: '#7444A0', cyan: '#20A6B7', ink: '#152A3A', muted: '#607181', canvas: '#F4F7FA'
          },
          fontFamily: { display:['Montserrat','sans-serif'], body:['Open Sans','sans-serif'] },
          boxShadow: { soft:'0 18px 55px rgba(12,54,88,.10)', lift:'0 14px 30px rgba(8,77,136,.16)' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin:0; background:#F4F7FA; color:#152A3A; }
    button, input, textarea { font:inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #82C7FA; outline-offset:3px; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { scrollbar-width:none; }
    .paper-grid { background-image:linear-gradient(rgba(8,117,201,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(8,117,201,.05) 1px,transparent 1px); background-size:24px 24px; }
    .fade { animation:fade .3s ease-out both; }
    @keyframes fade { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
    @media print { nav,.screen-only { display:none!important; } main { padding:0!important; } .print-card { box-shadow:none!important; border:1px solid #ccd6df; } }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useMemo, useState } = React;

const stages = [
  { id:1, name:'Brainstorming', short:'Explorar', icon:'brain', color:'#F58220', time:20, objective:'Levantar o maior número possível de problemas relacionados ao tema.', guide:['Escreva um problema por post-it.','Não julgue as ideias — tudo vale neste momento.','Foque em situações reais que dificultam o bem-estar no trabalho.'] },
  { id:2, name:'Card Sorting', short:'Agrupar', icon:'layout-grid', color:'#E7A715', time:15, objective:'Agrupar os problemas levantados em temas comuns.', guide:['Agrupe os post-its por similaridade de assuntos.','Dê um nome claro para cada grupo (ex: "Ergonomia", "Segurança").','Não se preocupe com perfeição — o importante é encontrar padrões.'] },
  { id:3, name:'Priorização', short:'Escolher', icon:'star', color:'#7444A0', time:10, objective:'Após organizar dos problemas, votar no mais importante.', guide:['Cada participante deverá escolher um problema para seguir para a próxima etapa.'] },
  { id:4, name:'Matriz CSD', short:'Entender', icon:'table-2', color:'#4DAA32', time:20, objective:'Organizar o que sabemos, achamos e não sabemos sobre o problema.', guide:['Escreva em post its tudo o que sabem, supõem ou têm dúvida sobre o assunto escolhido.','Separe os post its nas colunas:', 'Certezas: Fatos conhecidos.','Suposições: Achismos ou hipóteses.','Dúvidas: O que gostaríamos de entender melhor.'] },
  { id:5, name:'Como Podemos?', short:'Reformular', icon:'wand-sparkles', color:'#20A6B7', time:15, objective:'Transformar o problema em uma pergunta criativa e solucionável.', guide:['Comece a frase com: "Como podemos..."','Mantenha a pergunta aberta, mas com foco claro.','Pergunta deve dar abertura à criatividade e inovação.','Deve estar centrada nas pessoas envolvidas.'] },
  { id:6, name:'Benchmarking', short:'Inspirar', icon:'search', color:'#0875C9', time:15, objective:'Pesquisar soluções já existentes no mercado ou em outras empresas, para inspirar ideias inovadoras que possam ser adaptadas ao nosso contexto.', guide:['Faça uma busca rápida na internet sobre soluções inovadoras relacionadas ao desafio.','Não precisa ser da mesma área: inspire-se também em outros setores ou mercados que enfrentam problemas semelhantes.','Dê preferência a exemplos que envolvam tecnologia ou novas formas de fazer.','Observe o que pode ser adaptado para a realidade da empresa.','Registre os exemplos mais interessantes para usar na próxima etapa.'] },
  { id:7, name:'Brainwriting', short:'Criar', icon:'pen-line', color:'#F58220', time:25, objective:'Gerar ideias em silêncio para estimular a criatividade.', guide:['Cada participante recebe uma folha e escreve uma ideia para resolver o problema.','Após 4 min, todos passam sua folha para a pessoa à direita, no sentido horário.','A intenção é ler a ideia recebida e contribuir com complemento ou melhoria (4 min).','O processo se repete até que cada um receba de volta sua folha de origem.','Ao final, o participante terá 4 min para ler as contribuições e resumir em um único post-it.'] },
  { id:8, name:'Mapa Conceitual', short:'Estruturar', icon:'network', color:'#D64C72', time:20, objective:'Estruturar a ideia que será apresentada.', guide:['O Mapa Conceitual é uma ferramenta que auxilia a representação visual e conceitual da ideia.','Preencha as perguntas em grupo:','Dê um nome para sua ideia / solução.','Qual problema sua ideia resolve?','Como funciona a solução?','Quem será beneficiado?','O que há de inovador na ideia?','Quais dificuldades para implementar?'] },
  { id:9, name:'Pitch', short:'Apresentar', icon:'presentation', color:'#073B6F', time:5, objective:'Comunicar a proposta de forma clara, objetiva e convincente.', guide:['Cada grupo terá 5 minutos para apresentar:','O Problema','A Solução','O Diferencial','Os Benefícios','Os Próximos passos'] }
];

const starter = {
  ideas:['Postura inadequada nas bancadas','Falta de apoio psicológico','Falta de engajamento no DDS', 'Alertas do Uso de EPI','Orientação ergonômica no posto'],
  groups:[{name:'Ergonomia',items:['Postura inadequada nas bancadas','Orientação ergonômica no posto']},{name:'Saúde',items:['Falta de apoio psicológico']},{name:'Segurança do Trabalho',items:['Falta de engajamento no DDS', 'Alertas do Uso de EPI']}],
  votes:{0:2,1:0,2:1,3:0},
  csd:{certezas:['Há queixas de dores musculares.'],suposicoes:['Treinamentos atuais não são suficientes.'],duvidas:['Quais setores possuem maior incidência?']},
  hmw:'Como podemos tornar o uso de EPIs mais confortável e aceito por todos os setores?',
  benchmark:['Soluções observadas','Princípios que podem ser adaptados'],
  brainwriting:['Lembretes inteligentes de pausa','Microtreinamentos no posto','Painel de indicadores por setor'],
  map:{nome:'Ergo em Movimento',problema:'Dores musculares e desengajamento',funciona:'Rotina de pausas e orientação',beneficiado:'Pessoas em postos operacionais',inovador:'Ações gamificadas adaptadas ao setor',dificuldades:'Tempo da operação para execução das pausas'},
  checklist:[false,false,false,false]
};

function Icon({name,size=20,className=''}) {
  return <i data-lucide={name} className={className} style={{width:size,height:size}} aria-hidden="true"></i>;
}
function Button({children,variant='primary',className='',...props}) {
  const styles={primary:'bg-brand-600 text-white hover:bg-brand-800 shadow-lift',secondary:'bg-white text-brand-800 border border-brand-100 hover:bg-brand-50',ghost:'text-muted hover:bg-brand-50 hover:text-brand-800',danger:'text-red-700 hover:bg-red-50'};
  return <button className={`min-h-11 rounded-xl px-4 py-2.5 font-bold transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed ${styles[variant]} ${className}`} {...props}>{children}</button>
}
function ExampleCard({title,children,tone='blue'}) {
  const tones={blue:'bg-brand-50 border-brand-100 text-brand-900',amber:'bg-amber-50 border-amber-100 text-amber-900',green:'bg-green-50 border-green-100 text-green-900',purple:'bg-purple-50 border-purple-100 text-purple-900',rose:'bg-rose-50 border-rose-100 text-rose-900'};
  return <section className={`rounded-2xl border p-5 sm:p-6 min-w-0 ${tones[tone]||tones.blue}`}><h3 className="font-display font-bold text-lg mb-4">{title}</h3>{children}</section>;
}
function ReadOnlyList({items}) {
  return <ul className="space-y-3">{items.map((item,i)=><li key={`${item}-${i}`} className="flex gap-3 items-start rounded-xl bg-white/80 border border-white p-3 shadow-sm"><span className="w-7 h-7 shrink-0 rounded-full bg-white text-brand-700 grid place-items-center text-xs font-extrabold">{i+1}</span><span className="text-sm leading-relaxed break-words">{item}</span></li>)}</ul>;
}
function Workspace({stage}) {
  const intro=<div className="mb-6 rounded-2xl bg-white border border-slate-200 p-5 flex gap-4 items-start shadow-sm"><span className="w-11 h-11 shrink-0 rounded-xl bg-brand-50 text-brand-700 grid place-items-center"><Icon name="eye"/></span><div><p className="font-display font-bold text-brand-900">Exemplo para consulta</p><p className="text-sm text-muted mt-1">Use a referência abaixo para compreender o resultado esperado. Este material não coleta nem armazena respostas.</p></div></div>;
  if(stage.id===1) return <>{intro}<ExampleCard title="Exemplos de situações, problemas ou oportunidades" tone="amber"><ReadOnlyList items={starter.ideas}/></ExampleCard></>;
  if(stage.id===2) return <>{intro}<div className="grid md:grid-cols-3 gap-4">{starter.groups.map((g,i)=><ExampleCard key={g.name} title={g.name} tone={['amber','green','blue'][i]}><ReadOnlyList items={g.items}/></ExampleCard>)}</div></>;
  if(stage.id===3) return <>{intro}<div className="grid lg:grid-cols-[1fr_300px] gap-6"><ExampleCard title="Exemplo de resultado da priorização" tone="purple"><ReadOnlyList items={starter.ideas.map((x,i)=>`${x} — ${starter.votes[i]||0} voto(s)`)}/><p className="mt-4 text-sm font-bold">Mais votado: Postura inadequada nas bancadas.</p></ExampleCard><ExampleCard title="Critérios de análise" tone="purple"><ReadOnlyList items={['Impacto','Frequência','Urgência','Inovação','Viabilidade']}/></ExampleCard></div></>;
  if(stage.id===4) return <>{intro}<div className="grid md:grid-cols-3 gap-4"><ExampleCard title="Certezas" tone="green"><ReadOnlyList items={starter.csd.certezas}/></ExampleCard><ExampleCard title="Suposições" tone="amber"><ReadOnlyList items={starter.csd.suposicoes}/></ExampleCard><ExampleCard title="Dúvidas" tone="rose"><ReadOnlyList items={starter.csd.duvidas}/></ExampleCard></div></>;
  if(stage.id===5) return <>{intro}<ExampleCard title="Exemplo de pergunta Como Podemos?" tone="blue"><blockquote className="text-lg sm:text-xl font-semibold leading-relaxed">“{starter.hmw}”</blockquote><p className="mt-4 text-sm">A formulação é aberta, centrada nas pessoas e não antecipa uma solução específica.</p></ExampleCard></>;
  if(stage.id===6) return <>{intro}<div className="grid md:grid-cols-2 gap-4"><ExampleCard title="Soluções observadas" tone="blue"><ReadOnlyList items={['Aplicativos de lembretes de pausas ativas','Microtreinamentos exibidos no posto de trabalho','Painéis de indicadores de saúde por setor']}/></ExampleCard><ExampleCard title="Princípios que podem ser adaptados" tone="green"><ReadOnlyList items={['Intervenções curtas integradas à rotina','Feedback visual simples e frequente','Gamificação adequada ao contexto operacional']}/></ExampleCard></div></>;
  if(stage.id===7) return <>{intro}<ExampleCard title="Exemplo de ideias construídas no Brainwriting" tone="amber"><ReadOnlyList items={starter.brainwriting}/><div className="mt-5 rounded-xl bg-white/80 p-4 text-sm"><strong>Exemplo de evolução:</strong> “Lembretes de pausa” pode evoluir para lembretes personalizados por setor, com metas coletivas e acompanhamento visual.</div></ExampleCard></>;
  if(stage.id===8) return <>{intro}<div className="grid md:grid-cols-2 gap-4">{Object.entries({nome:'Nome da ideia / solução',problema:'Problema que resolve',funciona:'Como funciona',beneficiado:'Quem será beneficiado',inovador:'O que há de inovador',dificuldades:'Dificuldades para implementar'}).map(([key,label])=><ExampleCard key={key} title={label} tone={key==='nome'?'rose':'blue'}><p className="leading-relaxed">{starter.map[key]}</p></ExampleCard>)}</div></>;
  return <>{intro}<div className="grid lg:grid-cols-[.9fr_1.1fr] gap-6"><ExampleCard title="Exemplo de roteiro de Pitch" tone="blue"><ReadOnlyList items={['Problema: dores musculares e baixa adesão às pausas','Solução: rotina gamificada de pausas e orientação','Diferencial: ações adaptadas a cada setor','Benefícios: prevenção, engajamento e acompanhamento','Próximo passo: testar a solução em um setor-piloto']}/></ExampleCard><ExampleCard title="Checklist para revisar a apresentação" tone="green"><ReadOnlyList items={['O problema está claro e sustentado por evidência?','A solução responde diretamente ao problema?','O diferencial e os benefícios estão explícitos?','O próximo passo é concreto e verificável?']}/></ExampleCard></div></>;
}
function App(){
  const [screen,setScreen]=useState('home');
  const [step,setStep]=useState(1);
  const [present,setPresent]=useState(false);
  const [guide,setGuide]=useState(true);
  const stage=stages[step-1];
  const total=useMemo(()=>stages.reduce((a,b)=>a+b.time,0),[]);

  useEffect(()=>{lucide.createIcons()},[screen,step,present,guide]);
  useEffect(()=>{window.scrollTo({top:0,behavior:'smooth'})},[step]);
  
  const go=n=>{setStep(Math.max(1,Math.min(9,n)));setScreen('workshop')};



  return <div className="min-h-screen font-body flex flex-col w-full overflow-x-hidden">
    {!present&&<nav className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
      <div className="max-w-7xl mx-auto h-18 px-4 sm:px-6 flex items-center justify-between gap-4 py-3">
<button onClick={()=>setScreen('home')} className="flex items-center gap-3 text-left min-w-0">

        <div className="hidden md:flex items-center gap-1"><button onClick={()=>setScreen('home')} className="px-4 py-2 rounded-lg font-semibold hover:bg-brand-50 whitespace-nowrap">Início</button><button onClick={()=>setScreen('journey')} className="px-4 py-2 rounded-lg font-semibold hover:bg-brand-50 whitespace-nowrap">Jornada</button><button onClick={()=>go(step)} className="px-4 py-2 rounded-lg font-semibold hover:bg-brand-50 whitespace-nowrap">Oficina</button></div>
        <Button variant="secondary" onClick={()=>setPresent(true)} className="shrink-0"><Icon name="monitor-up"/><span className="hidden sm:inline">Apresentar</span></Button>
      </div>
    </nav>}

    {screen==='home'&&<main className="overflow-hidden flex-1 w-full">
      <section className="relative bg-brand-900 text-white min-h-[70vh] flex items-center">
        <div className="absolute inset-0 paper-grid opacity-40"></div><div className="absolute -right-28 -top-28 w-96 h-96 rounded-full bg-action/20 blur-3xl"></div>
        <div className="relative max-w-7xl mx-auto px-6 py-20 grid lg:grid-cols-[1.15fr_.85fr] gap-14 items-center">
          <div>
            <div className="inline-flex gap-2 items-center bg-white/10 border border-white/15 px-4 py-2 rounded-full text-sm font-bold"><Icon name="users" size={17}/> Facilitação guiada e colaborativa</div>
            <h1 className="font-display font-extrabold text-4xl sm:text-6xl leading-[1.05] mt-7">Consulte a jornada e veja exemplos de cada etapa.</h1>
            <p className="text-lg sm:text-xl text-blue-100 max-w-2xl mt-6 leading-relaxed">Uma jornada prática para levantar problemas, compreender o contexto, criar alternativas e estruturar uma proposta de valor focada nas pessoas e nos negócios.</p>
            <div className="flex flex-wrap gap-3 mt-9"><Button className="bg-action hover:bg-orange-600" onClick={()=>go(1)}>Consultar etapas <Icon name="arrow-right"/></Button><Button variant="secondary" onClick={()=>setScreen('journey')}><Icon name="map"/> Ver jornada</Button></div>
            <div className="grid grid-cols-3 max-w-xl mt-10 pt-7 border-t border-white/15">
              <div><strong className="font-display text-2xl">9</strong><span className="block text-sm text-blue-200">etapas</span></div>
              <div><strong className="font-display text-2xl">{Math.floor(total/60)}h{String(total%60).padStart(2,'0')}</strong><span className="block text-sm text-blue-200">duração sugerida</span></div>
              {/*<div><strong className="font-display text-2xl">1</strong><span className="block text-sm text-blue-200">proposta final</span></div>*/}
            </div>
          </div>
          <div className="relative">
            <div className="bg-white text-ink rounded-[28px] shadow-2xl p-6 sm:p-8 rotate-1">
              <div className="flex items-center justify-between"><p className="font-display font-bold text-brand-900">Exemplos de resultados esperados</p><span className="w-12 h-12 rounded-2xl bg-amber-100 text-action grid place-items-center"><Icon name="lightbulb" size={28}/></span></div>
              <ul className="mt-6 space-y-4">
                {['Problema priorizado com clareza','Certezas, hipóteses e lacunas explícitas','Ideias construídas de forma colaborativa','Proposta de valor pronta para validação'].map((x,i)=><li key={x} className="flex gap-3"><span className="w-7 h-7 shrink-0 rounded-full bg-green-100 text-success grid place-items-center text-sm font-bold">{i+1}</span><span>{x}</span></li>)}
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section className="bg-white py-20 border-b border-slate-200">
        <div className="max-w-7xl mx-auto px-6 grid lg:grid-cols-[1fr_1.2fr] gap-14">
          <div>
            <h2 className="font-display text-3xl font-extrabold text-brand-900 mb-6 flex items-center gap-3"><span className="w-10 h-10 rounded-xl bg-action/10 text-action grid place-items-center"><Icon name="target"/></span> Objetivos da Oficina</h2>
            <p className="text-muted mb-6">Ao final da oficina os participantes serão capazes de:</p>
            <ul className="space-y-4">
               {['Identificar problemas relevantes', 'Priorizar desafios', 'Compreender melhor o contexto', 'Formular perguntas de inovação', 'Buscar referências', 'Criar soluções colaborativamente', 'Estruturar uma proposta de valor'].map(obj => <li key={obj} className="flex gap-3 text-lg"><Icon name="check-circle-2" className="text-success shrink-0 mt-0.5"/> <span>{obj}</span></li>)}
            </ul>
          </div>
          <div>
            <h2 className="font-display text-3xl font-extrabold text-brand-900 mb-6 flex items-center gap-3"><span className="w-10 h-10 rounded-xl bg-brand-100 text-brand-600 grid place-items-center"><Icon name="list-ordered"/></span> Agenda da Oficina</h2>
            <div className="bg-canvas rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                <ol className="grid sm:grid-cols-2 gap-x-8 gap-y-4">
                    {stages.map((s, i) => <li key={s.id} className="flex items-center gap-4 bg-white p-3 rounded-xl border border-slate-100 shadow-sm"><span className="w-8 h-8 shrink-0 rounded-full bg-brand-800 text-white text-sm font-bold grid place-items-center">{i+1}</span> <span className="font-semibold text-brand-900">{s.name}</span></li>)}
                </ol>
            </div>
          </div>
        </div>
      </section>
    </main>}

    {screen==='journey'&&<main className="max-w-7xl mx-auto px-6 py-12 fade w-full"><div className="max-w-3xl"><span className="text-action font-bold uppercase tracking-wider text-sm">Visão geral</span><h1 className="font-display text-4xl font-extrabold text-brand-900 mt-2">Jornada da inovação</h1><p className="text-muted text-lg mt-4">A sequência reduz a incerteza progressivamente: primeiro amplia a compreensão, depois abre possibilidades e, por fim, converge para uma proposta testável.</p></div><div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 mt-10">{stages.map(s=><button key={s.id} onClick={()=>go(s.id)} className="text-left bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 hover:-translate-y-1 hover:shadow-lift transition"><span className="w-11 h-11 rounded-xl text-white grid place-items-center" style={{background:s.color}}><Icon name={s.icon}/></span><span className="block text-xs font-bold text-muted mt-5">ETAPA {s.id}</span><strong className="block font-display text-brand-900 mt-1">{s.name}</strong><span className="block text-sm text-muted mt-2">{s.time} min</span></button>)}</div></main>}

    {screen==='workshop'&&<main className={`${present?'p-3 sm:p-5 lg:p-8':'max-w-7xl mx-auto px-4 sm:px-6 py-7'} fade w-full flex-1 flex flex-col min-w-0`}>
      {present&&<button onClick={()=>setPresent(false)} className="fixed right-5 top-5 z-50 bg-brand-900 text-white px-4 py-3 rounded-xl shadow-xl font-bold flex gap-2"><Icon name="minimize-2"/> Sair</button>}
      
      {!present&&<div className="screen-only bg-white border rounded-2xl p-2 flex gap-2 overflow-x-auto no-scrollbar mb-6 snap-x w-full" aria-label="Etapas da oficina">
        {stages.map(s=><button key={s.id} onClick={()=>go(s.id)} aria-current={step===s.id?'step':undefined} className={`shrink-0 snap-start rounded-xl px-4 py-3 flex gap-3 items-center transition ${step===s.id?'bg-brand-800 text-white shadow':'hover:bg-brand-50'}`}><span className={`w-7 h-7 shrink-0 rounded-lg grid place-items-center text-xs font-extrabold ${step===s.id?'bg-white/15':'bg-slate-100 text-brand-900'}`}>{s.id}</span><span className="text-left min-w-0"><strong className="block text-sm whitespace-nowrap">{s.short}</strong><small className={`whitespace-nowrap ${step===s.id?'text-blue-100':'text-muted'}`}>{s.time} min</small></span></button>)}
        <div className="w-1 shrink-0" aria-hidden="true"></div>
      </div>}
      
      <div className="print-card bg-white rounded-[26px] border border-slate-200 shadow-soft flex flex-col w-full max-w-full overflow-hidden">
        <div className="h-1.5 bg-slate-100 w-full"><div className="h-full bg-success transition-all" style={{width:`${(step/9)*100}%`}}></div></div>
        
        <header className="p-5 sm:p-8 border-b flex flex-col xl:flex-row xl:items-center gap-6 justify-between min-w-0">
          <div className="flex gap-4 min-w-0 w-full">
            <span className="w-14 h-14 rounded-2xl text-white grid place-items-center shrink-0" style={{background:stage.color}}><Icon name={stage.icon} size={28}/></span>
            <div className="min-w-0"><p className="text-xs font-extrabold tracking-widest text-muted">ETAPA {stage.id} DE 9</p><h1 className="font-display text-2xl sm:text-4xl font-extrabold text-brand-900 break-words">{stage.name}</h1><p className="text-muted mt-2 max-w-3xl"><strong>Objetivo:</strong> {stage.objective}</p></div>
          </div>
          <div className="screen-only rounded-xl bg-amber-50 text-amber-800 px-4 py-3 font-display font-extrabold flex gap-2 shrink-0" aria-label={`Duração sugerida: ${stage.time} minutos`}>
            <Icon name="clock-3"/>{stage.time} min
          </div>
        </header>

        {/* Ordem invertida no mobile (flex-col-reverse): Guia aparece antes do Workspace no celular, e lado a lado no desktop (xl:grid-cols-[1fr_320px] e xl:flex-row) */}
        <div className="flex flex-col xl:grid xl:grid-cols-[1fr_320px] min-w-0 w-full">
          
          {/* Seção de exemplos para consulta */}
          <section className="p-4 sm:p-6 lg:p-8 bg-canvas/70 min-h-[440px] min-w-0 overflow-x-hidden order-2 xl:order-1">
            <Workspace stage={stage}/>
          </section>
          
          {/* Guia de Orientações (aparece ANTES no celular graças ao order-1, e à direita no desktop graças ao grid) */}
          {guide&&<aside className="border-b xl:border-b-0 xl:border-l border-slate-200 p-5 sm:p-6 bg-white flex flex-col justify-between shrink-0 order-1 xl:order-2">
            <div>
              <div className="flex justify-between items-center">
                <h2 className="font-display font-bold text-brand-900 flex gap-2"><Icon name="compass"/> Orientações</h2>
                <button onClick={()=>setGuide(false)} aria-label="Fechar guia"><Icon name="x"/></button>
              </div>
              <ol className="mt-5 space-y-4">
                {stage.guide.map((x,i)=><li key={x} className="flex gap-3 text-sm"><span className="w-6 h-6 shrink-0 rounded-full bg-brand-50 text-brand-700 grid place-items-center font-bold">{i+1}</span><span className="break-words">{x}</span></li>)}
              </ol>
            </div>
            
          </aside>}
        </div>

        <footer className="screen-only p-4 sm:px-8 border-t flex flex-wrap items-center justify-between gap-3 bg-white w-full">
          <Button variant="ghost" disabled={step===1} onClick={()=>go(step-1)}><Icon name="arrow-left"/> Anterior</Button>
          <div className="flex gap-2">
            {!guide&&<Button variant="secondary" onClick={()=>setGuide(true)}><Icon name="panel-right-open"/> Abrir guia</Button>}
            <Button onClick={()=>step===9?setScreen('done'):go(step+1)}>{step===9?'Concluir oficina':'Próxima etapa'} <Icon name={step===9?'check':'arrow-right'}/></Button>
          </div>
        </footer>
      </div>
    </main>}

    {screen==='done'&&<main className="min-h-[80vh] grid place-items-center p-6 w-full"><div className="text-center max-w-2xl"><span className="w-24 h-24 rounded-full bg-green-100 text-success grid place-items-center mx-auto"><Icon name="check-circle-2" size={52}/></span><h1 className="font-display text-4xl font-extrabold text-brand-900 mt-7">A oficina chegou a uma proposta testável.</h1><p className="text-lg text-muted mt-4">O próximo passo é transformar as principais hipóteses em um experimento pequeno, mensurável e seguro.</p><div className="flex flex-wrap justify-center gap-3 mt-8"><Button onClick={()=>go(1)}><Icon name="rotate-ccw"/> Revisar jornada</Button><Button variant="secondary" onClick={()=>window.print()}><Icon name="printer"/> Imprimir registro</Button></div></div></main>}
  </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
